actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
cli:
  version: 1.25.0
lint:
  disabled:
    - pinact
    - cspell
    - renovate
  enabled:
    - actionlint@1.7.12
    - checkov@3.3.17
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.6
    - trufflehog@3.97.4
    - yamllint@1.38.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
version: 0.1
merge:
  required_statuses:
    - CodeQL
    - devskim
    - codacy
